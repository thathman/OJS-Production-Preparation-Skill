profile_version: 4

journal:
  name: null
  abbreviation: null
  publisher: null
  website: null
  issn_print: null
  issn_online: null
  doi_prefix: null
  languages: []

publication:
  model: null # volume_issue | continuous | annual | other
  frequency: null
  uses_volume: null
  uses_issue_number: null
  uses_year: true
  pagination: null # page_range | article_number | elocation | none
  issue_url_pattern: null
  article_url_pattern: null
  article_url_generation:
    strategy: concise_title_summary
    target_terms_min: 3
    target_terms_max: 6
    separator: hyphen
    lowercase: true
    omit_filler_terms: true
    omit_leading_articles_when_safe: true
    preserve_distinctive_topic_terms: true
    allow_familiar_abbreviations: true
    never_slugify_full_title: true
    collision_resolution: add_minimal_distinguishing_term

sections: []

contacts:
  editorial: null
  submissions: null
  production: null
  support: null
  general: null
  copyright_licensing: null
  technical: null

rights:
  copyright_holder: null
  licence_name: null
  licence_short_name: null
  licence_url: null
  journal_policy_overrides_article_text: false

source_priority:
  - current_official_website
  - current_journal_setup_document
  - final_published_article_or_issue
  - current_submission_guidelines
  - final_accepted_manuscript
  - submission_metadata
  - user_preference

extraction:
  mode: clean # strict | clean | copyedited | hybrid
  silently_reconcile_conflicts: false
  remove_ocr_duplicates: true
  repair_layout_hyphenation: true
  preserve_authored_grammar: true
  provenance_tracking: true

missing_values:
  default: flag # blank | not_stated | flag | ask | generate_if_allowed

output:
  mode: compact # compact | standard | detailed | audit
  html: plain_text # plain_text | ojs_html | both
  keyword_separator: comma # comma | semicolon | line

article_publication:
  title_structure:
    split_subtitle_on_first_colon: true
    strip_separator_colon: true
    prefix_terms:
      - A
      - An
      - The
    move_leading_main_title_article_to_prefix: true
    keep_subtitle_leading_article_in_subtitle: true
    require_reconstruction_match: true

  metadata:
    keywords:
      enabled: true
      policy: extract_only
      generated_phrase_length_words:
        min: 1
        max: 3
      preserve_longer_author_supplied_keywords: true
    supporting_agencies:
      enabled: true
      policy: extract_or_blank
      include_funding_sources: true
      include_explicit_institutional_support: true
      never_copy_affiliation_without_support_evidence: true
    coverage:
      enabled: true
      policy: extract_or_blank
      allowed_dimensions:
        - spatial
        - temporal
        - jurisdictional
      never_use_as_general_topic_field: true
    rights:
      enabled: true
      policy: extract_or_flag
      may_include:
        - copyright
        - intellectual_property_rights
        - licence_rights
        - property_rights
      never_use_for_doi: true
    source:
      enabled: true
      policy: extract_or_blank
      meaning: derived_from_work_or_resource
      may_use_source_work_identifier: true
      never_use_submission_own_doi: true
      never_auto_copy_submission_citation: true
    type:
      enabled: true
      policy: extract_or_flag
      vocabulary: dublin_core
      default_for_unambiguously_textual_journal_submission: Text
      keep_separate_from_ojs_section: true
    data_availability_statement:
      enabled: true
      policy: extract_or_flag
      never_invent_availability_status: true
      never_invent_repository_or_accession: true

  identifiers:
    publisher_id:
      enabled: null # true | false | null when not yet determined
      policy: extract_or_flag
      purpose: external_database_or_deposit_identifier
      pattern: null
      detect_before_asking: true
      ask_if_undetermined: true
      never_use_for_doi: true

  galley:
    label:
      enabled: true
      required: true
      policy: extract_or_flag
      pattern: null
    url_path:
      enabled: true
      policy: generate_if_missing
      pattern: null
    keep_galley_url_path_distinct_from_article_url_path: true

quicksubmit:
  preserve_interface_order: true
  fields:
    section:
      enabled: true
      policy: extract_or_flag
    prefix:
      enabled: true
      policy: extract_or_blank
    title:
      enabled: true
      policy: extract_only
    subtitle:
      enabled: true
      policy: extract_or_blank
    abstract:
      enabled: true
      policy: extract_only
    coverage_information:
      enabled: true
      policy: extract_or_blank
    type:
      enabled: true
      policy: extract_or_flag
    source:
      enabled: true
      policy: extract_or_blank
    rights:
      enabled: true
      policy: extract_or_flag
    data_availability_statement:
      enabled: true
      policy: extract_or_flag
    subjects:
      enabled: false
      policy: ignore
    disciplines:
      enabled: false
      policy: ignore
    keywords:
      enabled: true
      policy: extract_only
    supporting_agencies:
      enabled: true
      policy: extract_or_blank
    references:
      enabled: true
      policy: extract_only

authors:
  fields:
    given_name: true
    middle_name: false
    family_name: true
    preferred_public_name: false
    email: true
    orcid: true
    affiliation: true
    department: false
    institution: false
    city: false
    state_region: false
    country: true
    biography: false
    corresponding_author: true
    principal_contact: false
    phone: false
  ambiguous_name_split: flag

article_history:
  received: true
  revised: true
  accepted: true
  published: true
  version_date: false

article_declarations:
  data_availability:
    enabled: true
    policy: extract_or_flag
  funding:
    enabled: true
    policy: extract_or_blank
  competing_interests:
    enabled: false
    policy: extract_or_blank
  ethics:
    enabled: false
    policy: extract_or_blank
  consent_for_publication:
    enabled: false
    policy: extract_or_blank
  author_contributions:
    enabled: false
    policy: extract_or_blank
  acknowledgements:
    enabled: false
    policy: extract_or_blank
  trial_registration:
    enabled: false
    policy: extract_or_blank

references:
  mode: clean # exact | clean | normalize | validate
  style: null
  search_missing_dois: false
  validate_numbering: true
  detect_duplicates: true

issue:
  data:
    date_published:
      enabled: true
      policy: extract_or_flag
    identification:
      volume:
        enabled: true
        policy: extract_or_flag
      number:
        enabled: true
        policy: extract_or_flag
      year:
        enabled: true
        policy: extract_or_flag
      title:
        enabled: true
        policy: generate_if_missing
    description:
      enabled: true
      policy: generate_if_missing
    cover_image:
      enabled: true
      file_policy: extract_or_blank
      alternate_text:
        enabled: true
        policy: generate_if_missing
    url_path:
      enabled: true
      policy: generate_if_missing
      pattern: null

  galley:
    enabled: true
    file:
      enabled: true
      policy: extract_or_flag
    label:
      enabled: true
      policy: extract_or_flag
      pattern: null
    publisher_id:
      enabled: null # true | false | null when not yet determined
      policy: extract_or_flag
      pattern: null
      detect_before_asking: true
      ask_if_undetermined: true
    url_path:
      enabled: true
      policy: generate_if_missing
      pattern: null

  identifiers:
    publisher_id:
      enabled: null # true | false | null when not yet determined
      policy: extract_or_flag
      pattern: null
      detect_before_asking: true
      ask_if_undetermined: true

  description_length: standard # short | standard | detailed | custom
  description_custom_words: null
  require_whole_issue_synthesis: true
  keep_issue_and_galley_url_paths_distinct: true
  keep_issue_and_galley_publisher_ids_distinct: true

html:
  allow_inline_css: true
  font_family: "Helvetica, Arial, sans-serif"
  font_size: "0.95rem"
  line_height: 1.7
  text_color: "#333333"
  justify_paragraphs: true
  allow_tables: true
  allow_external_fonts: false
  allow_javascript: false
  format_scientific_names: true
  format_chemical_notation: true

qa:
  blockers:
    missing_required_title: true
    missing_required_author: true
    unresolved_page_overlap: true
    unresolved_volume_issue_conflict: true
    missing_required_article_galley_label: true
    doi_used_as_publisher_id: true
    missing_required_issue_galley: true
    missing_required_issue_galley_label: true
    missing_required_issue_url_path: false
    missing_required_issue_galley_url_path: false
    missing_configured_article_publisher_id: true
    missing_configured_issue_publisher_id: true
    missing_configured_issue_galley_publisher_id: true
  warnings:
    title_mismatch: true
    prefix_title_subtitle_parse_mismatch: true
    article_url_path_full_title_slug: true
    article_url_path_too_vague: true
    duplicate_article_url_path: true
    author_name_mismatch: true
    author_order_mismatch: true
    corresponding_author_mismatch: true
    abstract_mismatch: true
    own_doi_used_as_source: true
    section_used_as_type: true
    unsupported_supporting_agency: true
    invalid_coverage_semantics: true
    invented_data_availability: true
    article_galley_url_path_conflict: true
    article_publisher_id_pattern_conflict: true
    scientific_value_conflict: true
    organism_inconsistency: true
    abbreviation_inconsistency: true
    licence_text_url_mismatch: true
    journal_url_mismatch: true
    page_gap: true
    duplicate_pagination: true
    article_type_mismatch: true
    malformed_reference: true
    missing_required_declaration: true
    doi_format_mismatch: true
    publication_date_conflict: true
    issue_url_path_conflict: true
    issue_galley_url_path_conflict: true
    publisher_id_pattern_conflict: true

profile_state:
  status: provisional # provisional | confirmed
  detected_from: []
  unresolved_questions: []
  conflicts: []
